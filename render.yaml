services:
  - type: web
    name: hermes-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: ANTHROPIC_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USERS
        sync: false
      - key: TELEGRAM_HOME_CHANNEL
        sync: false
    disk:
      name: hermes-data
      mountPath: /root/.hermes
      sizeGB: 1
